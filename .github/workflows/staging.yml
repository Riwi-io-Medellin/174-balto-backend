name: Deploy Staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: riwi-io-medellin/back-end-pets

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:staging-${{ github.sha }} \
            -f back-end-pets/Dockerfile .

      - name: Push Docker Image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:staging-${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            docker pull ghcr.io/riwi-io-medellin/back-end-pets:staging-${{ github.sha }}

            docker stop back-end-pets-staging || true
            docker rm back-end-pets-staging || true

            docker run -d \
              --name back-end-pets-staging \
              --restart unless-stopped \
              --network proxy \
              -p 5001:8080 \
              -e ASPNETCORE_ENVIRONMENT=Staging \
              -e ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION }}" \
              -e Jwt__Key="${{ secrets.JWT_KEY }}" \
              -e Cloudinary__CloudName="${{ secrets.CLOUDINARY__CLOUDNAME }}" \
              -e Cloudinary__ApiKey="${{ secrets.CLOUDINARY__APIKEY }}" \
              -e Cloudinary__ApiSecret="${{ secrets.CLOUDINARY__APISECRET }}" \
              ghcr.io/riwi-io-medellin/back-end-pets:staging-${{ github.sha }}

            sleep 15

            docker ps

            docker logs back-end-pets-staging --tail 50

            curl -f http://localhost:5001 || true