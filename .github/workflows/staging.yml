name: Deploy Staging

on:
  push:
    branches: ["staging"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: riwi-io-medellin/back-end-pets

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:staging-${{ github.sha }} \
            -f back-end-pets/Dockerfile .

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:staging-${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ghcr.io/riwi-io-medellin/back-end-pets:staging-${{ github.sha }}

            docker stop back-end-pets-staging || true
            docker rm back-end-pets-staging || true

            docker run -d \
              --name back-end-pets-staging \
              -p 5001:8080 \
              -e ASPNETCORE_ENVIRONMENT=Staging \
              ghcr.io/riwi-io-medellin/back-end-pets:staging-${{ github.sha }}

            sleep 10

            curl -f http://localhost:5001/health || exit 1