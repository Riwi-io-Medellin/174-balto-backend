name: Deploy Staging

on:
  push:
    branches: ["staging"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/back-end-pets

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build -t $IMAGE:staging-${{ github.sha }} -f back-end-pets/Dockerfile .

      - name: Push image
        run: |
          docker push $IMAGE:staging-${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull $IMAGE:staging-${{ github.sha }}

            docker stop back-end-pets-staging || true
            docker rm back-end-pets-staging || true

            docker run -d \
              --name back-end-pets-staging \
              -p 5001:8080 \
              -e ASPNETCORE_ENVIRONMENT=Staging \
              $IMAGE:staging-${{ github.sha }}

            sleep 10

            curl -f http://localhost:5001/health || exit 1