name: Deploy Production

on:
  push:
    branches: ["main"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/back-end-pets

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build -t $IMAGE:prod-${{ github.sha }} -f back-end-pets/Dockerfile .

      - name: Push image
        run: docker push $IMAGE:prod-${{ github.sha }}

      - name: Deploy (blue/green simple)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            OLD=$(docker ps -q -f name=back-end-pets-production || true)

            docker pull $IMAGE:prod-${{ github.sha }}

            docker run -d \
              --name back-end-pets-production-new \
              -p 5000:8080 \
              -e ASPNETCORE_ENVIRONMENT=Production \
              $IMAGE:prod-${{ github.sha }}

            sleep 10

            if curl -f http://localhost:5000/health; then
              docker stop back-end-pets-production || true
              docker rm back-end-pets-production || true
              docker rename back-end-pets-production-new back-end-pets-production
            else
              docker stop back-end-pets-production-new
              docker rm back-end-pets-production-new
              exit 1
            fi