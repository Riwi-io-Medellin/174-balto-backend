name: Deploy Production

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: riwi-io-medellin/back-end-pets

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:prod-${{ github.sha }} \
            -f back-end-pets/Dockerfile .

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:prod-${{ github.sha }}

      - name: Deploy with zero downtime
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ghcr.io/riwi-io-medellin/back-end-pets:prod-${{ github.sha }}

            docker run -d \
              --name back-end-pets-production-new \
              -p 5000:8080 \
              -e ASPNETCORE_ENVIRONMENT=Production \
              ghcr.io/riwi-io-medellin/back-end-pets:prod-${{ github.sha }}

            sleep 10

            if curl -f http://localhost:5000/health; then
              docker stop back-end-pets-production || true
              docker rm back-end-pets-production || true
              docker rename back-end-pets-production-new back-end-pets-production
            else
              docker stop back-end-pets-production-new || true
              docker rm back-end-pets-production-new || true
              exit 1
            fi